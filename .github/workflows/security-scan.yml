name: security-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 19 * * *" # 04:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: security gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect \
            --source /repo \
            --no-banner \
            --redact \
            --exit-code 1

      - name: Flutter dependency audit
        run: |
          dart pub global activate dependency_validator
          dart pub global run dependency_validator

      - name: Semgrep high-confidence scan
        run: |
          python3 -m pip install --upgrade semgrep
          semgrep scan --config p/secrets --config p/javascript --severity ERROR --error
